version: 2.1

jobs:
  build_and_test:
    docker:
      - image: cimg/python:3.10.1
      - image: circleci/postgres:9.6.2
        environment:
          POSTGRES_USER: root
          POSTGRES_DB: circle_test

    steps:
      - checkout

      - run:
          name: Установка зависимостей
          command: pip install pipenv && pipenv install --dev

      - run:
          name: Запуск тестов
          command: pipenv run python manage.py test

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results
          destination: test-results

      - persist_to_workspace:
          root: .
          paths:
            - .
